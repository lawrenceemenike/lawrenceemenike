<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040706"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <radialGradient id="dynamic-light" cx="70%" cy="30%" r="70%">
      <animate attributeName="cx" values="70%; 30%; 80%; 70%" dur="13s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#18C7B5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0E0D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="0"/>
      <stop offset="40%" stop-color="#F26A2E" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#18C7B5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F26A2E" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-ember" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .sig-badge { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #F26A2E; letter-spacing: 1px; font-weight: 700; }
    .sig-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; fill: #F3F0E7; letter-spacing: 0.2px; }
    .sig-desc { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8A9691; font-style: italic; }
    .sig-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #F26A2E; letter-spacing: 1px; }
  </style>

  <!-- Surface Base -->
  <rect width="1000" height="120" rx="6" fill="url(#card-bg)"/>
  <rect width="1000" height="120" rx="6" fill="url(#dynamic-light)"/>
  <rect width="1000" height="120" rx="6" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="118" rx="5" fill="none" stroke="#F26A2E" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Left Accent Bar (Ember Compliance) -->
  <line x1="0" y1="0" x2="5" y2="120" stroke="#F26A2E" stroke-width="3" filter="url(#glow-ember)"/>

  <!-- Sentient Background Morphing Wave -->
  <path fill="none" stroke="url(#wave-grad)" stroke-width="2" filter="url(#glow-ember)">
    <animate attributeName="d"
             dur="8.5s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 80 C 200 20, 420 110, 650 40 C 820 100, 920 30, 1050 70;
               M -50 40 C 180 100, 380 30, 650 90 C 800 20, 950 110, 1050 50;
               M -50 90 C 250 30, 450 100, 650 20 C 850 110, 900 40, 1050 80;
               M -50 80 C 200 20, 420 110, 650 40 C 820 100, 920 30, 1050 70
             "/>
  </path>

  <!-- Content -->
  <g transform="translate(24, 26)">
    <circle cx="10" cy="10" r="3.5" fill="#F26A2E" filter="url(#glow-ember)">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.4; 1; 0.4" />
    </circle>
    <text x="22" y="14" class="sig-badge">SIGNAL_004 — GOVERNANCE &amp; EXPLAINABILITY</text>

    <!-- Title -->
    <text x="22" y="38" class="sig-title">Audit Trails &amp; Explainability for Compliance: The Transparency Layer</text>
    
    <!-- Description -->
    <text x="22" y="62" class="sig-desc">Designing audit-ready governance frameworks, model explainability &amp; regulatory compliance layers for financial institutions.</text>
  </g>

  <!-- Right Click Button Pill -->
  <g transform="translate(775, 42)">
    <rect x="0" y="0" width="195" height="34" rx="4" fill="#080C0B" stroke="#F26A2E" stroke-opacity="0.6" stroke-width="1"/>
    <text x="18" y="21" class="sig-btn">READ ARTICLE ON MEDIUM ↗</text>
  </g>
</svg>
