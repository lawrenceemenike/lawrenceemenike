<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060908"/>
      <stop offset="40%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <!-- Signal Light Traces -->
    <linearGradient id="trace-main" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="25%" stop-color="#18C7B5" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0D8E86" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#F26A2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ember-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="1"/>
      <stop offset="30%" stop-color="#F26A2E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F26A2E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="teal-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="1"/>
      <stop offset="40%" stop-color="#18C7B5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="sf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18C7B5" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="40" cy="40" r="0.8" fill="#18C7B5" fill-opacity="0.2"/>
    </pattern>

    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .node-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #F3F0E7; letter-spacing: 2px; }
    .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #18C7B5; letter-spacing: 1.5px; }
    .node-sub-ember { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #F26A2E; letter-spacing: 1.5px; }
  </style>

  <!-- Background -->
  <rect width="900" height="240" rx="8" fill="url(#sf-bg)"/>
  <rect width="900" height="240" rx="8" fill="url(#sf-grid)"/>
  <rect x="1" y="1" width="898" height="238" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Network Vectors (Simulating night photography light trails / data contours) -->
  <g stroke-linecap="round">
    <!-- Contour line 1 -->
    <path d="M -50 160 C 150 160, 200 70, 380 70 C 560 70, 620 180, 850 180 C 890 180, 930 150, 950 140" fill="none" stroke="url(#trace-main)" stroke-width="2" filter="url(#glow-heavy)"/>
    
    <!-- Contour line 2 (Secondary Teal) -->
    <path d="M -50 180 C 120 180, 220 90, 400 90 C 580 90, 600 160, 830 160" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6 4"/>
    
    <!-- Fine Grid Rays -->
    <line x1="180" y1="0" x2="180" y2="240" stroke="#8A9691" stroke-opacity="0.08" stroke-dasharray="2 2"/>
    <line x1="380" y1="0" x2="380" y2="240" stroke="#18C7B5" stroke-opacity="0.12" stroke-dasharray="4 4"/>
    <line x1="620" y1="0" x2="620" y2="240" stroke="#8A9691" stroke-opacity="0.08" stroke-dasharray="2 2"/>
    <line x1="780" y1="0" x2="780" y2="240" stroke="#F26A2E" stroke-opacity="0.1" stroke-dasharray="2 4"/>
  </g>

  <!-- Key Nodes: TRUST, VALUE, CONTROL, INTELLIGENCE -->
  
  <!-- NODE 1: TRUST (x: 180, y: 125) -->
  <g transform="translate(180, 125)">
    <circle cx="0" cy="0" r="16" fill="url(#teal-pulse)"/>
    <circle cx="0" cy="0" r="3.5" fill="#18C7B5"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="1"/>
    <text x="14" y="-2" class="node-label">TRUST</text>
    <text x="14" y="10" class="node-sub">[GOVERNANCE]</text>
  </g>

  <!-- NODE 2: CONTROL (x: 380, y: 70) -->
  <g transform="translate(380, 70)">
    <circle cx="0" cy="0" r="22" fill="url(#ember-pulse)"/>
    <circle cx="0" cy="0" r="4.5" fill="#F26A2E"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#F26A2E" stroke-opacity="0.8" stroke-width="1"/>
    <text x="16" y="-4" class="node-label" fill="#F3F0E7">CONTROL</text>
    <text x="16" y="9" class="node-sub-ember">[SECURITY LAYER]</text>
  </g>

  <!-- NODE 3: VALUE (x: 620, y: 180) -->
  <g transform="translate(620, 180)">
    <circle cx="0" cy="0" r="16" fill="url(#teal-pulse)"/>
    <circle cx="0" cy="0" r="3.5" fill="#18C7B5"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="1"/>
    <text x="14" y="-2" class="node-label">VALUE</text>
    <text x="14" y="10" class="node-sub">[FINAI / ROI]</text>
  </g>

  <!-- NODE 4: INTELLIGENCE (x: 780, y: 140) -->
  <g transform="translate(780, 140)">
    <circle cx="0" cy="0" r="14" fill="url(#teal-pulse)"/>
    <circle cx="0" cy="0" r="3" fill="#18C7B5"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="-2" class="node-label">INTELLIGENCE</text>
    <text x="14" y="10" class="node-sub">[DECISION ENGINE]</text>
  </g>

  <!-- Signature Overlay Labels -->
  <text x="24" y="218" class="node-sub" font-size="9" opacity="0.6">NELC DIGITAL // SIGNAL FIELD V2.4</text>
  <text x="876" y="218" class="node-sub" font-size="9" text-anchor="end" opacity="0.6">COORDINATES // 6.5244° N, 3.3792° E</text>
</svg>
