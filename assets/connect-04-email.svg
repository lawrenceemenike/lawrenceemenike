<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040706"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <radialGradient id="dynamic-light" cx="70%" cy="30%" r="70%">
      <animate attributeName="cx" values="70%; 30%; 80%; 70%" dur="13s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#18C7B5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0E0D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="0"/>
      <stop offset="40%" stop-color="#F26A2E" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#18C7B5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F26A2E" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-ember" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .conn-key { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #F26A2E; letter-spacing: 1px; font-weight: 700; }
    .conn-val { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; fill: #F26A2E; letter-spacing: 0.2px; }
    .conn-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8A9691; }
    .conn-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #F26A2E; letter-spacing: 1px; }
  </style>

  <!-- Surface Base -->
  <rect width="1000" height="100" rx="6" fill="url(#card-bg)"/>
  <rect width="1000" height="100" rx="6" fill="url(#dynamic-light)"/>
  <rect width="1000" height="100" rx="6" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="98" rx="5" fill="none" stroke="#F26A2E" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Left Accent Bar (Ember Highlight) -->
  <line x1="0" y1="0" x2="5" y2="100" stroke="#F26A2E" stroke-width="3" filter="url(#glow-ember)"/>

  <!-- Sentient Background Wave -->
  <path fill="none" stroke="url(#wave-grad)" stroke-width="2" filter="url(#glow-ember)">
    <animate attributeName="d"
             dur="8.5s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 60 C 200 15, 420 85, 650 30 C 820 80, 920 20, 1050 55;
               M -50 30 C 180 80, 380 20, 650 70 C 800 15, 950 85, 1050 40;
               M -50 70 C 250 20, 450 80, 650 15 C 850 85, 900 30, 1050 65;
               M -50 60 C 200 15, 420 85, 650 30 C 820 80, 920 20, 1050 55
             "/>
  </path>

  <!-- Content -->
  <g transform="translate(24, 22)">
    <circle cx="10" cy="10" r="3.5" fill="#F26A2E" filter="url(#glow-ember)">
      <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.4; 1; 0.4" />
    </circle>
    <text x="22" y="14" class="conn-key">[04] DIRECT EMAIL — ADVISORY &amp; KEYNOTES</text>

    <text x="22" y="38" class="conn-val">lawrence@nelc.digital</text>
    <text x="22" y="58" class="conn-sub">Enterprise Transformation Advisory, C-Suite Keynotes &amp; Direct Engagement</text>
  </g>

  <!-- Right Click Button Pill -->
  <g transform="translate(795, 33)">
    <rect x="0" y="0" width="175" height="34" rx="4" fill="#080C0B" stroke="#F26A2E" stroke-opacity="0.6" stroke-width="1"/>
    <text x="16" y="21" class="conn-btn">SEND DIRECT EMAIL ↗</text>
  </g>
</svg>
