<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="conn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040706"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <!-- DYNAMIC AMBIENT LIGHT SHIFT -->
    <radialGradient id="dynamic-conn-light" cx="70%" cy="40%" r="65%">
      <animate attributeName="cx" values="70%; 30%; 80%; 70%" dur="15s" repeatCount="indefinite" />
      <animate attributeName="cy" values="40%; 70%; 30%; 40%" dur="15s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#F26A2E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0E0D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="conn-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="conn-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#18C7B5" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#F26A2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-ember" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .conn-hdr { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #18C7B5; letter-spacing: 2.5px; }
    .conn-key { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #18C7B5; font-weight: 700; letter-spacing: 1px; }
    .conn-key-ember { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #F26A2E; font-weight: 700; letter-spacing: 1px; }
    .conn-val { font-family: 'Inter', sans-serif; font-size: 13.5px; fill: #F3F0E7; font-weight: 600; letter-spacing: 0.2px; }
    .conn-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8A9691; }
  </style>

  <!-- Panel Base -->
  <rect width="1000" height="320" rx="8" fill="url(#conn-bg)"/>
  <rect width="1000" height="320" rx="8" fill="url(#dynamic-conn-light)"/>
  <rect width="1000" height="320" rx="8" fill="url(#conn-grid)"/>
  <rect x="1" y="1" width="998" height="318" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Sentient Background Wave Morphing -->
  <path fill="none" stroke="url(#conn-wave-grad)" stroke-width="2.5" filter="url(#glow-soft)">
    <animate attributeName="d"
             dur="8s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 220 C 200 120, 450 280, 650 150 C 820 70, 920 240, 1050 160;
               M -50 130 C 220 260, 380 80, 650 220 C 800 140, 950 70, 1050 220;
               M -50 190 C 180 70, 420 240, 650 110 C 850 250, 900 110, 1050 150;
               M -50 220 C 200 120, 450 280, 650 150 C 820 70, 920 240, 1050 160
             "/>
  </path>

  <!-- Top Terminal Header Bar -->
  <path d="M 1 8 Q 1 1 8 1 L 992 1 Q 999 1 999 8 L 999 38 L 1 38 Z" fill="#060908" stroke="#18C7B5" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1" y1="38" x2="999" y2="38" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="4.5" fill="#F26A2E" opacity="0.8"/>
  <circle cx="38" cy="19" r="4.5" fill="#8A9691" opacity="0.4"/>
  <circle cx="52" cy="19" r="4.5" fill="#18C7B5" opacity="0.6"/>

  <text x="74" y="23" class="conn-hdr">07 // CONNECT &amp; DISCOVERY REGISTRY [DIRECT_CHANNELS]</text>
  <text x="976" y="23" class="conn-hdr" text-anchor="end" fill="#8A9691" opacity="0.6">DIRECT_DIRECTORY // ONLINE</text>

  <!-- 4 CONNECT CHANNEL MODULES (2x2 Grid) -->
  <g transform="translate(24, 52)">

    <!-- CHANNEL 1: STUDIO -->
    <g transform="translate(0, 0)">
      <rect width="466" height="115" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="115" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>
      
      <circle cx="24" cy="24" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="36" y="28" class="conn-key">[01] STUDIO</text>
      <text x="36" y="56" class="conn-val">Nelc Digital</text>
      <text x="36" y="80" class="conn-sub">Strategic AI Consultancy, Operating Layers &amp; Engineering</text>
    </g>

    <!-- CHANNEL 2: LINKEDIN -->
    <g transform="translate(486, 0)">
      <rect width="466" height="115" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="115" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>
      
      <circle cx="24" cy="24" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="36" y="28" class="conn-key">[02] LINKEDIN</text>
      <text x="36" y="56" class="conn-val">linkedin.com/in/emeniken</text>
      <text x="36" y="80" class="conn-sub">Executive Insights, C-Suite Network &amp; Thought Leadership</text>
    </g>

    <!-- CHANNEL 3: MEDIUM -->
    <g transform="translate(0, 130)">
      <rect width="466" height="115" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="115" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>
      
      <circle cx="24" cy="24" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="36" y="28" class="conn-key">[03] MEDIUM</text>
      <text x="36" y="56" class="conn-val">lawrence-emenike.medium.com</text>
      <text x="36" y="80" class="conn-sub">Deep-dive AI Frameworks, Economics &amp; Technical Playbooks</text>
    </g>

    <!-- CHANNEL 4: DIRECT EMAIL (Ember Highlight) -->
    <g transform="translate(486, 130)">
      <rect width="466" height="115" rx="6" fill="#080C0B" stroke="#F26A2E" stroke-opacity="0.35" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="115" stroke="#F26A2E" stroke-width="3" filter="url(#glow-ember)"/>
      
      <circle cx="24" cy="24" r="3.5" fill="#F26A2E">
        <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <text x="36" y="28" class="conn-key-ember">[04] DIRECT EMAIL</text>
      <text x="36" y="56" class="conn-val" fill="#F26A2E">lawrence@nelc.digital</text>
      <text x="36" y="80" class="conn-sub">Enterprise Advisory, Keynote Briefings &amp; Direct Engagement</text>
    </g>

  </g>

  <!-- Corner Brackets -->
  <path d="M 1 20 L 1 1 L 20 1" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
  <path d="M 980 319 L 999 319 L 999 300" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
</svg>
