<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <pattern id="sig-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="sig-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#18C7B5" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#F26A2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .sig-hdr { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #18C7B5; letter-spacing: 2.5px; }
    .sig-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; fill: #F3F0E7; letter-spacing: 0.5px; }
    .sig-sub { font-family: 'Inter', sans-serif; font-size: 13px; fill: #8A9691; letter-spacing: 0.2px; }
    .sig-badge-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #18C7B5; letter-spacing: 1px; }
  </style>

  <!-- Panel Surface Base -->
  <rect width="1000" height="240" rx="8" fill="url(#sig-bg)"/>
  <rect width="1000" height="240" rx="8" fill="url(#sig-grid)"/>
  <rect x="1" y="1" width="998" height="238" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Sentient Background Wave Morphing -->
  <path fill="none" stroke="url(#sig-wave-grad)" stroke-width="2.5" filter="url(#glow-soft)">
    <animate attributeName="d"
             dur="7.5s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 180 C 200 80, 420 230, 650 120 C 820 40, 920 200, 1050 140;
               M -50 110 C 180 230, 380 70, 650 200 C 800 130, 950 60, 1050 200;
               M -50 160 C 250 40, 450 210, 650 90 C 850 220, 900 110, 1050 150;
               M -50 180 C 200 80, 420 230, 650 120 C 820 40, 920 200, 1050 140
             "/>
  </path>

  <!-- Top Terminal Header Bar -->
  <path d="M 1 8 Q 1 1 8 1 L 992 1 Q 999 1 999 8 L 999 38 L 1 38 Z" fill="#060908" stroke="#18C7B5" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1" y1="38" x2="999" y2="38" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="4.5" fill="#F26A2E" opacity="0.8"/>
  <circle cx="38" cy="19" r="4.5" fill="#8A9691" opacity="0.4"/>
  <circle cx="52" cy="19" r="4.5" fill="#18C7B5" opacity="0.6"/>

  <text x="74" y="23" class="sig-hdr">04 // SIGNALS &amp; THOUGHT LEADERSHIP REGISTRY</text>
  <text x="976" y="23" class="sig-hdr" text-anchor="end" fill="#8A9691" opacity="0.6">MEDIUM_ARTICLES // 05 PUBLISHED</text>

  <!-- Section Title & Subtitle inside graphic card -->
  <g transform="translate(32, 75)">
    <text x="0" y="22" class="sig-title">THOUGHT LEADERSHIP &amp; RESEARCH SIGNALS</text>
    <text x="0" y="48" class="sig-sub">Curated executive articles, economic frameworks, transformer architecture deep-dives &amp; agentic playbooks:</text>

    <!-- Signal Metrics Pill Grid -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="180" height="30" rx="4" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="15" r="3.5" fill="#18C7B5" filter="url(#glow-soft)">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <text x="28" y="19" class="sig-badge-text">AI ECONOMICS</text>

      <rect x="195" y="0" width="200" height="30" rx="4" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="211" cy="15" r="3.5" fill="#18C7B5" filter="url(#glow-soft)">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <text x="223" y="19" class="sig-badge-text">AGENTIC COMMERCIALS</text>

      <rect x="410" y="0" width="210" height="30" rx="4" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="426" cy="15" r="3.5" fill="#18C7B5" filter="url(#glow-soft)">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <text x="438" y="19" class="sig-badge-text">TRANSFORMER ARCHITECTURE</text>

      <rect x="635" y="0" width="170" height="30" rx="4" fill="#080C0B" stroke="#F26A2E" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="651" cy="15" r="3.5" fill="#F26A2E" filter="url(#glow-soft)">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <text x="663" y="19" class="sig-badge-text" fill="#F26A2E">GOVERNANCE &amp; VOICE</text>
    </g>
  </g>

  <!-- Frame Corner Brackets -->
  <path d="M 1 20 L 1 1 L 20 1" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
  <path d="M 980 239 L 999 239 L 999 220" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
</svg>
