<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%">
  <defs>
    <linearGradient id="sig-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040706"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <!-- DYNAMIC AMBIENT LIGHT SHIFT -->
    <radialGradient id="dynamic-sig-light" cx="60%" cy="40%" r="65%">
      <animate attributeName="cx" values="60%; 30%; 70%; 60%" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="40%; 70%; 30%; 40%" dur="16s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#F26A2E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0E0D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="sig-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="sig-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#18C7B5" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#F26A2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-ember" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .sig-hdr { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #18C7B5; letter-spacing: 2.5px; }
    .sig-tag { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #18C7B5; letter-spacing: 1px; font-weight: 700; }
    .sig-tag-ember { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #F26A2E; letter-spacing: 1px; font-weight: 700; }
    .sig-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; fill: #F3F0E7; letter-spacing: 0.2px; }
    .sig-desc { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8A9691; font-style: italic; line-height: 1.4; }
  </style>

  <!-- Panel Base -->
  <rect width="1000" height="540" rx="8" fill="url(#sig-bg)"/>
  <rect width="1000" height="540" rx="8" fill="url(#dynamic-sig-light)"/>
  <rect width="1000" height="540" rx="8" fill="url(#sig-grid)"/>
  <rect x="1" y="1" width="998" height="538" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Sentient Background Wave Morphing across full card height -->
  <path fill="none" stroke="url(#sig-wave-grad)" stroke-width="2.5" filter="url(#glow-soft)">
    <animate attributeName="d"
             dur="8.5s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 380 C 200 180, 420 480, 650 240 C 820 120, 920 410, 1050 320;
               M -50 240 C 180 410, 380 160, 650 380 C 800 240, 950 160, 1050 360;
               M -50 320 C 250 140, 450 390, 650 200 C 850 420, 900 200, 1050 260;
               M -50 380 C 200 180, 420 480, 650 240 C 820 120, 920 410, 1050 320
             "/>
  </path>

  <!-- Top Terminal Header Bar -->
  <path d="M 1 8 Q 1 1 8 1 L 992 1 Q 999 1 999 8 L 999 38 L 1 38 Z" fill="#060908" stroke="#18C7B5" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1" y1="38" x2="999" y2="38" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="4.5" fill="#F26A2E" opacity="0.8"/>
  <circle cx="38" cy="19" r="4.5" fill="#8A9691" opacity="0.4"/>
  <circle cx="52" cy="19" r="4.5" fill="#18C7B5" opacity="0.6"/>

  <text x="74" y="23" class="sig-hdr">04 // SIGNALS &amp; THOUGHT LEADERSHIP REGISTRY</text>
  <text x="976" y="23" class="sig-hdr" text-anchor="end" fill="#8A9691" opacity="0.6">MEDIUM_PUBLICATIONS // 05 ENTRIES</text>

  <!-- 5 ARTICLE ENTRIES GRID -->
  <g transform="translate(24, 52)">

    <!-- ARTICLE 1 -->
    <g transform="translate(0, 0)">
      <rect width="952" height="84" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="84" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>
      
      <circle cx="24" cy="24" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="36" y="27" class="sig-tag">SIGNAL_001 —</text>
      <text x="145" y="27" class="sig-title">The Economics of AI: From Labor Substitution to Complementarities</text>
      <text x="36" y="56" class="sig-desc">Analyzing macroeconomic shifts, labor market impacts, and how enterprise AI transitions from task replacement to value complementarities.</text>
    </g>

    <!-- ARTICLE 2 -->
    <g transform="translate(0, 94)">
      <rect width="952" height="84" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="84" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>
      
      <circle cx="24" cy="24" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="36" y="27" class="sig-tag">SIGNAL_002 —</text>
      <text x="145" y="27" class="sig-title">Transforming Pricing: How Agentic AI Rewrites Commercial Economics</text>
      <text x="36" y="56" class="sig-desc">Deconstructing value-based pricing, unit margin shifts, and automated commercial decision models for autonomous agent workflows.</text>
    </g>

    <!-- ARTICLE 3 -->
    <g transform="translate(0, 188)">
      <rect width="952" height="84" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="84" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>
      
      <circle cx="24" cy="24" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="36" y="27" class="sig-tag">SIGNAL_003 —</text>
      <text x="145" y="27" class="sig-title">Why “Attention Is All You Need” Changed Everything (And How It Works)</text>
      <text x="36" y="56" class="sig-desc">Demystifying transformer architectures, self-attention mechanisms, and the mathematical foundation of modern generative AI systems.</text>
    </g>

    <!-- ARTICLE 4 (Ember Highlight for Compliance) -->
    <g transform="translate(0, 282)">
      <rect width="952" height="84" rx="6" fill="#080C0B" stroke="#F26A2E" stroke-opacity="0.35" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="84" stroke="#F26A2E" stroke-width="3" filter="url(#glow-ember)"/>
      
      <circle cx="24" cy="24" r="3.5" fill="#F26A2E">
        <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <text x="36" y="27" class="sig-tag-ember">SIGNAL_004 —</text>
      <text x="145" y="27" class="sig-title">Audit Trails and Explainability for Compliance: Building the Transparency Layer</text>
      <text x="36" y="56" class="sig-desc">Designing audit-ready governance frameworks, model explainability, and regulatory compliance layers for financial institutions.</text>
    </g>

    <!-- ARTICLE 5 -->
    <g transform="translate(0, 376)">
      <rect width="952" height="84" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="0" y1="0" x2="5" y2="84" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>
      
      <circle cx="24" cy="24" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="36" y="27" class="sig-tag">SIGNAL_005 —</text>
      <text x="145" y="27" class="sig-title">An Executive Playbook to Building Voice AI Agents</text>
      <text x="36" y="56" class="sig-desc">Strategic engineering framework for low-latency turn-taking models, real-time voice synthesis, and production agent deployment.</text>
    </g>

  </g>

  <!-- Corner Brackets -->
  <path d="M 1 20 L 1 1 L 20 1" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
  <path d="M 980 539 L 999 539 L 999 520" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
</svg>
