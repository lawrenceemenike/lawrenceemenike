<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040706"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <radialGradient id="dynamic-light" cx="40%" cy="60%" r="70%">
      <animate attributeName="cx" values="40%; 80%; 30%; 40%" dur="15s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0D8E86" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0E0D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#18C7B5" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#0D8E86" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .conn-key { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #18C7B5; letter-spacing: 1px; font-weight: 700; }
    .conn-val { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; fill: #F3F0E7; letter-spacing: 0.2px; }
    .conn-sub { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8A9691; }
    .conn-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #18C7B5; letter-spacing: 1px; }
  </style>

  <!-- Surface Base -->
  <rect width="1000" height="100" rx="6" fill="url(#card-bg)"/>
  <rect width="1000" height="100" rx="6" fill="url(#dynamic-light)"/>
  <rect width="1000" height="100" rx="6" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="98" rx="5" fill="none" stroke="#18C7B5" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Left Accent Bar -->
  <line x1="0" y1="0" x2="5" y2="100" stroke="#18C7B5" stroke-width="3" filter="url(#glow-soft)"/>

  <!-- Sentient Background Wave -->
  <path fill="none" stroke="url(#wave-grad)" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="d"
             dur="7s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 70 C 250 20, 450 80, 650 15 C 850 85, 900 30, 1050 65;
               M -50 60 C 200 15, 420 85, 650 30 C 820 80, 920 20, 1050 55;
               M -50 30 C 180 80, 380 20, 650 70 C 800 15, 950 85, 1050 40;
               M -50 70 C 250 20, 450 80, 650 15 C 850 85, 900 30, 1050 65
             "/>
  </path>

  <!-- Content -->
  <g transform="translate(24, 22)">
    <circle cx="10" cy="10" r="3.5" fill="#18C7B5" filter="url(#glow-soft)">
      <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="0.4; 1; 0.4" />
    </circle>
    <text x="22" y="14" class="conn-key">[03] MEDIUM — PUBLICATIONS</text>

    <text x="22" y="38" class="conn-val">lawrence-emenike.medium.com</text>
    <text x="22" y="58" class="conn-sub">Deep-dive AI Frameworks, Commercial Economics &amp; Technical Playbooks</text>
  </g>

  <!-- Right Click Button Pill -->
  <g transform="translate(795, 33)">
    <rect x="0" y="0" width="175" height="34" rx="4" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1"/>
    <text x="16" y="21" class="conn-btn">READ MEDIUM ↗</text>
  </g>
</svg>
