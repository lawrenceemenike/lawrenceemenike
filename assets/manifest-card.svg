<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>
    <pattern id="card-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="teal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .code-key { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #8A9691; font-weight: 500; }
    .code-val { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #F3F0E7; font-weight: 400; }
    .code-val-teal { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #18C7B5; font-weight: 600; }
    .code-val-ember { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #F26A2E; font-weight: 500; }
    .card-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #18C7B5; letter-spacing: 2px; text-transform: uppercase; }
  </style>

  <!-- Card Background -->
  <rect width="900" height="310" rx="8" fill="url(#card-bg)"/>
  <rect width="900" height="310" rx="8" fill="url(#card-grid)"/>
  <rect x="1" y="1" width="898" height="308" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Top Terminal Header Bar -->
  <path d="M 1 8 Q 1 1 8 1 L 892 1 Q 899 1 899 8 L 899 38 L 1 38 Z" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1" y1="38" x2="899" y2="38" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Controls -->
  <circle cx="22" cy="19" r="4.5" fill="#F26A2E" opacity="0.8"/>
  <circle cx="36" cy="19" r="4.5" fill="#8A9691" opacity="0.4"/>
  <circle cx="50" cy="19" r="4.5" fill="#18C7B5" opacity="0.6"/>

  <text x="70" y="23" class="card-title">/MANIFEST // SYSTEM_IDENTITY_V2.6</text>
  <text x="870" y="23" class="card-title" text-anchor="end" fill="#8A9691" opacity="0.6">OPERATIONAL</text>

  <!-- Content Grid -->
  <g transform="translate(30, 65)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <!-- Line 1: Identity -->
      <text x="0" y="20" class="code-key">identity</text>
      <text x="120" y="20" class="code-val-teal">AI Transformation Consultant &amp; Agentic AI Engineer</text>

      <!-- Line 2: Studio -->
      <text x="0" y="50" class="code-key">studio</text>
      <text x="120" y="50" class="code-val">Nelc Digital <tspan fill="#8A9691">(Founder)</tspan></text>

      <!-- Line 3: Location -->
      <text x="0" y="80" class="code-key">location</text>
      <text x="120" y="80" class="code-val">Lagos, Nigeria <tspan fill="#18C7B5" font-size="11">[West Africa Hub]</tspan></text>

      <!-- Line 4: Mission -->
      <text x="0" y="110" class="code-key">mission</text>
      <text x="120" y="110" class="code-val" fill="#F3F0E7">Governed AI. Secure adoption. Measurable commercial value.</text>

      <!-- Divider -->
      <line x1="0" y1="130" x2="840" y2="130" stroke="#8A9691" stroke-opacity="0.15" stroke-dasharray="3 3"/>
    </g>

    <!-- Focus Areas & Status -->
    <g transform="translate(0, 150)">
      <text x="0" y="20" class="code-key">core_focus</text>
      
      <!-- Bullet grid -->
      <g transform="translate(120, 20)">
        <!-- Col 1 -->
        <circle cx="0" cy="-4" r="2.5" fill="#18C7B5"/>
        <text x="12" y="0" class="code-val">AI Strategy &amp; Enterprise Roadmaps</text>
        
        <circle cx="0" cy="26" r="2.5" fill="#18C7B5"/>
        <text x="12" y="30" class="code-val">Agentic AI Risk &amp; Security</text>

        <!-- Col 2 -->
        <circle cx="340" cy="-4" r="2.5" fill="#F26A2E"/>
        <text x="352" y="0" class="code-val">Responsible AI &amp; Governance</text>
        
        <circle cx="340" cy="26" r="2.5" fill="#18C7B5"/>
        <text x="352" y="30" class="code-val">FinAI &amp; Commercial Intelligence</text>
      </g>

      <!-- Status Row -->
      <text x="0" y="78" class="code-key">sys_status</text>
      <text x="120" y="78" class="code-val-ember">Designing intelligent operating systems for enterprise &amp; fintechs</text>
      
      <circle cx="680" cy="74" r="4" fill="#18C7B5" filter="url(#teal-glow)"/>
      <text x="692" y="78" class="code-key" fill="#18C7B5" font-size="11">ACTIVE_POLL</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 1 20 L 1 1 L 20 1" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
  <path d="M 880 309 L 899 309 L 899 290" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="1.5" fill="none"/>
</svg>
