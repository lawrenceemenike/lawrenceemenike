<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="100%" height="100%">
  <defs>
    <linearGradient id="pos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <pattern id="pos-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#18C7B5" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="pos-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#18C7B5" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#F26A2E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .pos-hdr { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #18C7B5; letter-spacing: 2.5px; }
    .pos-quote { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 19px; fill: #F3F0E7; letter-spacing: 0.3px; }
    .pos-pillar-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #18C7B5; letter-spacing: 1.5px; }
    .pos-pillar-title-ember { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #F26A2E; letter-spacing: 1.5px; }
    .pos-pillar-desc { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8A9691; line-height: 1.5; }
  </style>

  <!-- Panel Base Surface -->
  <rect width="1000" height="270" rx="8" fill="url(#pos-bg)"/>
  <rect width="1000" height="270" rx="8" fill="url(#pos-grid)"/>
  <rect x="1" y="1" width="998" height="268" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Dynamic Sentient Background Wave Morphing across panel -->
  <path fill="none" stroke="url(#pos-wave-grad)" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="d"
             dur="8s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 200 C 200 120, 400 240, 600 140 C 800 50, 900 210, 1050 160;
               M -50 120 C 180 250, 420 80, 600 220 C 780 160, 920 80, 1050 220;
               M -50 180 C 250 60, 380 220, 600 110 C 820 240, 880 120, 1050 150;
               M -50 200 C 200 120, 400 240, 600 140 C 800 50, 900 210, 1050 160
             "/>
  </path>

  <!-- Top Terminal Header Bar -->
  <path d="M 1 8 Q 1 1 8 1 L 992 1 Q 999 1 999 8 L 999 38 L 1 38 Z" fill="#060908" stroke="#18C7B5" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1" y1="38" x2="999" y2="38" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>

  <text x="24" y="24" class="pos-hdr">// OPERATING PHILOSOPHY &amp; STRATEGIC POSITIONING</text>
  <text x="976" y="24" class="pos-hdr" text-anchor="end" fill="#8A9691" opacity="0.6">NELC_DIGITAL_PHILOSOPHY</text>

  <!-- Quote Box / Central Mission Statement -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="952" height="54" rx="5" fill="#060A09" stroke="#18C7B5" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="0" y1="0" x2="6" y2="54" stroke="#18C7B5" stroke-width="4" filter="url(#glow-soft)"/>
    
    <text x="24" y="33" class="pos-quote">
      "Turning AI ambition into governed, secure, commercially intelligent systems."
    </text>
  </g>

  <!-- 3 Strategic Pillars Grid -->
  <g transform="translate(24, 126)">
    
    <!-- PILLAR 1: Operating Models -->
    <g transform="translate(0, 0)">
      <rect width="304" height="120" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>
      <circle cx="20" cy="22" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="32" y="26" class="pos-pillar-title">01 / OPERATING MODELS</text>
      
      <text x="20" y="54" class="pos-pillar-desc">Moving beyond isolated pilots &amp;</text>
      <text x="20" y="70" class="pos-pillar-desc">prompt engineering to systematic,</text>
      <text x="20" y="86" class="pos-pillar-desc">enterprise-wide AI architectures.</text>
      <line x1="20" y1="102" x2="284" y2="102" stroke="#18C7B5" stroke-opacity="0.15"/>
    </g>

    <!-- PILLAR 2: Governance & Security (Ember Highlight) -->
    <g transform="translate(324, 0)">
      <rect width="304" height="120" rx="6" fill="#080C0B" stroke="#F26A2E" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="20" cy="22" r="3.5" fill="#F26A2E">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <text x="32" y="26" class="pos-pillar-title-ember">02 / GOVERNANCE &amp; SECURITY</text>
      
      <text x="20" y="54" class="pos-pillar-desc">Building audit-ready risk controls,</text>
      <text x="20" y="70" class="pos-pillar-desc">human-in-the-loop oversight &amp;</text>
      <text x="20" y="86" class="pos-pillar-desc">agentic threat boundary defenses.</text>
      <line x1="20" y1="102" x2="284" y2="102" stroke="#F26A2E" stroke-opacity="0.2"/>
    </g>

    <!-- PILLAR 3: Commercial Value -->
    <g transform="translate(648, 0)">
      <rect width="304" height="120" rx="6" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>
      <circle cx="20" cy="22" r="3" fill="#18C7B5">
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3; 1; 0.3" />
      </circle>
      <text x="32" y="26" class="pos-pillar-title">03 / COMMERCIAL ROI</text>
      
      <text x="20" y="54" class="pos-pillar-desc">Aligning model execution with token</text>
      <text x="20" y="70" class="pos-pillar-desc">unit economics, FinOps control &amp;</text>
      <text x="20" y="86" class="pos-pillar-desc">quantifiable commercial impact.</text>
      <line x1="20" y1="102" x2="284" y2="102" stroke="#18C7B5" stroke-opacity="0.15"/>
    </g>

  </g>

  <!-- Frame Corner Brackets -->
  <path d="M 1 20 L 1 1 L 20 1" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="1.5" fill="none"/>
  <path d="M 980 269 L 999 269 L 999 250" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1.5" fill="none"/>
</svg>
