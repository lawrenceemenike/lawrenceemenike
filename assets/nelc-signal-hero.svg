<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Dark graphite gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040706"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#121816"/>
    </linearGradient>

    <!-- DYNAMIC AMBIENT CINEMATIC LIGHT SHIFT -->
    <radialGradient id="dynamic-bg-light" cx="70%" cy="30%" r="65%">
      <animate attributeName="cx" values="70%; 30%; 80%; 70%" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="30%; 70%; 20%; 30%" dur="14s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#0D8E86" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#F26A2E" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0A0E0D" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated Signal Teal Wave Beam -->
    <linearGradient id="teal-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="25%" stop-color="#18C7B5" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0D8E86" stop-opacity="1"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Animated Ember Wave Beam -->
    <linearGradient id="ember-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="0"/>
      <stop offset="40%" stop-color="#F26A2E" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#F26A2E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ember-glow-dynamic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="1"/>
      <stop offset="40%" stop-color="#F26A2E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F26A2E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="teal-glow-dynamic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="1"/>
      <stop offset="40%" stop-color="#18C7B5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </radialGradient>

    <!-- Background Grid -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18C7B5" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#18C7B5" fill-opacity="0.2"/>
    </pattern>

    <pattern id="subgrid-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#8A9691" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; fill: #F3F0E7; font-size: 38px; letter-spacing: 2px; }
    .title-sub { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #8A9691; font-size: 13px; letter-spacing: 3px; }
    .tag-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #18C7B5; letter-spacing: 1.5px; }
    .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #F3F0E7; letter-spacing: 1px; }
    .nav-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #8A9691; letter-spacing: 2px; }
  </style>

  <!-- Base Surfaces with Dynamic Moving Light Leak -->
  <rect width="1000" height="360" rx="8" fill="url(#bg-grad)"/>
  <rect width="1000" height="360" rx="8" fill="url(#dynamic-bg-light)"/>
  <rect width="1000" height="360" rx="8" fill="url(#subgrid-pattern)"/>
  <rect width="1000" height="360" rx="8" fill="url(#grid-pattern)"/>

  <!-- Border Lines & Frame Corner Brackets -->
  <rect x="1" y="1" width="998" height="358" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M 1 24 L 1 1 L 24 1" stroke="#18C7B5" stroke-width="2" fill="none" filter="url(#glow-filter)"/>
  <path d="M 976 1 L 999 1 L 999 24" stroke="#18C7B5" stroke-width="2" fill="none" filter="url(#glow-filter)"/>
  <path d="M 999 336 L 999 359 L 976 359" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="2" fill="none"/>
  <path d="M 24 359 L 1 359 L 1 336" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="2" fill="none"/>

  <!-- MOVING GRID SCAN LINES (DYNAMIC TELEMETRY RAYS) -->
  <g stroke-linecap="round">
    <line x1="620" y1="0" x2="820" y2="360" stroke="#18C7B5" stroke-opacity="0.18" stroke-dasharray="12 20">
      <animate attributeName="stroke-dashoffset" values="0; -320" dur="10s" repeatCount="indefinite" />
    </line>
    <line x1="720" y1="0" x2="920" y2="360" stroke="#18C7B5" stroke-opacity="0.12" stroke-dasharray="8 16">
      <animate attributeName="stroke-dashoffset" values="0; 240" dur="8s" repeatCount="indefinite" />
    </line>
    <line x1="150" y1="0" x2="350" y2="360" stroke="#F26A2E" stroke-opacity="0.15" stroke-dasharray="10 18">
      <animate attributeName="stroke-dashoffset" values="0; -280" dur="12s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- FLOATING DATA PARTICLES DRIFTING ACROSS CANVAS -->
  <g fill="#18C7B5" opacity="0.6" filter="url(#glow-filter)">
    <circle cx="120" cy="180" r="1.8">
      <animate attributeName="cx" values="120; 880; 120" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180; 80; 180" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="260" r="2.2">
      <animate attributeName="cx" values="800; 200; 800" dur="25s" repeatCount="indefinite" />
      <animate attributeName="cy" values="260; 120; 260" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="90" r="1.5" fill="#F26A2E">
      <animate attributeName="cx" values="450; 950; 450" dur="22s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90; 290; 90" dur="16s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================================================= -->
  <!-- SENTIENT WAVE ORGANISM — SMIL PATH MORPHING ANIMATIONS                     -->
  <!-- ========================================================================= -->

  <!-- WAVE 1: PRIMARY TEAL SENTIENT SIGNAL WAVE -->
  <path fill="none" stroke="url(#teal-wave-grad)" stroke-width="3.5" filter="url(#glow-heavy)">
    <animate attributeName="d"
             dur="7s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 280 C 200 280, 250 140, 500 140 C 750 140, 800 60, 1050 60;
               M -50 180 C 180 80, 320 290, 500 170 C 680 60, 850 240, 1050 100;
               M -50 220 C 250 320, 380 90, 500 240 C 720 280, 780 120, 1050 220;
               M -50 310 C 160 160, 280 250, 500 120 C 740 220, 860 80, 1050 160;
               M -50 280 C 200 280, 250 140, 500 140 C 750 140, 800 60, 1050 60
             "/>
  </path>

  <!-- WAVE 2: SECONDARY EMBER SENTIENT ENERGY WAVE -->
  <path fill="none" stroke="url(#ember-wave-grad)" stroke-width="2.5" filter="url(#glow-filter)">
    <animate attributeName="d"
             dur="9s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 300 C 220 300, 270 160, 520 160 C 770 160, 820 80, 1050 80;
               M -50 240 C 280 340, 350 110, 520 230 C 690 100, 890 280, 1050 140;
               M -50 160 C 190 70, 290 260, 520 100 C 750 240, 810 50, 1050 260;
               M -50 270 C 210 210, 310 180, 520 200 C 730 110, 840 190, 1050 90;
               M -50 300 C 220 300, 270 160, 520 160 C 770 160, 820 80, 1050 80
             "/>
  </path>

  <!-- WAVE 3: TERTIARY HIGH-FREQUENCY RIPPLE -->
  <path fill="none" stroke="#18C7B5" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 6">
    <animate attributeName="d"
             dur="6s"
             repeatCount="indefinite"
             calcMode="spline"
             keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
             values="
               M -50 150 C 150 220, 300 80, 500 190 C 700 300, 850 110, 1050 180;
               M -50 290 C 200 110, 350 270, 500 130 C 650 70, 800 240, 1050 90;
               M -50 180 C 220 310, 280 150, 500 260 C 720 120, 880 290, 1050 210;
               M -50 210 C 170 140, 320 200, 500 80 C 680 250, 830 150, 1050 120;
               M -50 150 C 150 220, 300 80, 500 190 C 700 300, 850 110, 1050 180
             "/>
  </path>

  <!-- DYNAMIC SENTIENT NODES -->
  <g transform="translate(0, 0)">
    <circle cx="520" cy="160" r="18" fill="url(#ember-glow-dynamic)">
      <animate attributeName="cy" dur="7s" repeatCount="indefinite" values="160; 170; 240; 120; 160" />
      <animate attributeName="r" dur="3s" repeatCount="indefinite" values="14; 22; 14" />
    </circle>
    <circle cx="520" cy="160" r="4.5" fill="#F26A2E" filter="url(#glow-filter)">
      <animate attributeName="cy" dur="7s" repeatCount="indefinite" values="160; 170; 240; 120; 160" />
    </circle>
    <circle cx="520" cy="160" r="9" fill="none" stroke="#F26A2E" stroke-opacity="0.8" stroke-width="1.5">
      <animate attributeName="cy" dur="7s" repeatCount="indefinite" values="160; 170; 240; 120; 160" />
    </circle>
    <text x="536" y="155" class="tag-mono" fill="#F26A2E" font-size="9.5" font-weight="700">
      <animate attributeName="y" dur="7s" repeatCount="indefinite" values="155; 165; 235; 115; 155" />
      NODE // 01 [SENTIENT_ACTIVE]
    </text>
  </g>

  <!-- Node 2: Teal Floating Node -->
  <g>
    <circle cx="270" cy="160" r="12" fill="url(#teal-glow-dynamic)">
      <animate attributeName="cy" dur="9s" repeatCount="indefinite" values="160; 100; 220; 140; 160" />
    </circle>
    <circle cx="270" cy="160" r="3.5" fill="#18C7B5">
      <animate attributeName="cy" dur="9s" repeatCount="indefinite" values="160; 100; 220; 140; 160" />
    </circle>
  </g>

  <!-- Node 3: Top Right Floating Teal Node -->
  <g>
    <circle cx="770" cy="80" r="14" fill="url(#teal-glow-dynamic)">
      <animate attributeName="cy" dur="6s" repeatCount="indefinite" values="80; 140; 60; 120; 80" />
    </circle>
    <circle cx="770" cy="80" r="4" fill="#18C7B5">
      <animate attributeName="cy" dur="6s" repeatCount="indefinite" values="80; 140; 60; 120; 80" />
    </circle>
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="tag-mono">SYS_ID // NELC_DIGITAL_01</text>
    <text x="920" y="0" class="tag-mono" text-anchor="end">LOCATION // LAGOS [6.5244° N, 3.3792° E]</text>
    <line x1="0" y1="12" x2="920" y2="12" stroke="#8A9691" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Hero Main Branding & Typography -->
  <g transform="translate(40, 115)">
    <text x="0" y="0" class="title-sub">NELC DIGITAL // INTELLIGENCE SYSTEMS STUDIO</text>
    
    <text x="0" y="45" class="title-main">NELC // SIGNAL ROOM</text>
    
    <text x="0" y="78" font-family="'Inter', sans-serif" font-size="15" fill="#8A9691" letter-spacing="0.3">
      Turning AI ambition into governed, secure, commercially intelligent systems.
    </text>

    <!-- Operational Status Pill -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="325" height="28" rx="4" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#18C7B5" filter="url(#glow-filter)">
        <animate attributeName="r" dur="2s" repeatCount="indefinite" values="3; 5; 3" />
        <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4; 1; 0.4" />
      </circle>
      <circle cx="16" cy="14" r="7" fill="none" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="1"/>
      <text x="32" y="18" class="pill-text">STATUS: BUILDING THE AI OPERATING LAYER</text>
    </g>
  </g>

  <!-- Bottom Navigation / Domain Bar -->
  <g transform="translate(40, 310)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>
    
    <line x1="0" y1="0" x2="180" y2="0" stroke="#18C7B5" stroke-width="2" filter="url(#glow-filter)"/>

    <g transform="translate(0, 24)">
      <circle cx="6" cy="-4" r="3" fill="#18C7B5"/>
      <text x="16" y="0" class="nav-label">AI STRATEGY</text>

      <circle cx="236" cy="-4" r="3" fill="#18C7B5"/>
      <text x="246" y="0" class="nav-label">GOVERNANCE &amp; RISK</text>

      <circle cx="506" cy="-4" r="3" fill="#F26A2E"/>
      <text x="516" y="0" class="nav-label" fill="#F3F0E7">AI SECURITY</text>

      <circle cx="736" cy="-4" r="3" fill="#18C7B5"/>
      <text x="746" y="0" class="nav-label">FINAI &amp; VALUE</text>
    </g>
  </g>

</svg>
