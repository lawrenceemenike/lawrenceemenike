<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Dark graphite gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A09"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <!-- Animated Signal Teal Beam -->
    <linearGradient id="teal-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#18C7B5" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0D8E86" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F26A2E" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Ember Beam -->
    <linearGradient id="ember-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F26A2E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <!-- Ember node radial glow -->
    <radialGradient id="ember-glow-dynamic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="1"/>
      <stop offset="40%" stop-color="#F26A2E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F26A2E" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal node radial glow -->
    <radialGradient id="teal-glow-dynamic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="1"/>
      <stop offset="40%" stop-color="#18C7B5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </radialGradient>

    <!-- Background Grid -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18C7B5" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#18C7B5" fill-opacity="0.2"/>
    </pattern>

    <!-- Subgrid -->
    <pattern id="subgrid-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#8A9691" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* CSS Animations for GitHub Markdown SVG rendering */
    @keyframes flow-trace-1 {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flow-trace-2 {
      0% { stroke-dashoffset: -1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-ember-node {
      0% { r: 14px; opacity: 0.5; }
      50% { r: 24px; opacity: 1.0; }
      100% { r: 14px; opacity: 0.5; }
    }
    @keyframes pulse-beacon {
      0% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.3; transform: scale(0.9); }
    }
    @keyframes scanline-move {
      0% { transform: translateY(-10px); opacity: 0; }
      50% { opacity: 0.15; }
      100% { transform: translateY(370px); opacity: 0; }
    }
    @keyframes text-glow {
      0% { text-shadow: 0 0 2px rgba(24, 199, 181, 0.2); }
      50% { text-shadow: 0 0 12px rgba(24, 199, 181, 0.8), 0 0 20px rgba(24, 199, 181, 0.4); }
      100% { text-shadow: 0 0 2px rgba(24, 199, 181, 0.2); }
    }

    .anim-stream-1 {
      stroke-dasharray: 200 400;
      animation: flow-trace-1 12s linear infinite;
    }
    .anim-stream-2 {
      stroke-dasharray: 150 350;
      animation: flow-trace-2 9s linear infinite;
    }
    .anim-ember-pulse {
      transform-origin: 520px 160px;
      animation: pulse-ember-node 3.5s ease-in-out infinite;
    }
    .anim-status-dot {
      animation: pulse-beacon 2s ease-in-out infinite;
    }
    .anim-scanline {
      animation: scanline-move 8s ease-in-out infinite;
    }

    .title-main { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; fill: #F3F0E7; font-size: 38px; letter-spacing: 2px; }
    .title-sub { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #8A9691; font-size: 13px; letter-spacing: 3px; }
    .tag-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #18C7B5; letter-spacing: 1.5px; }
    .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #F3F0E7; letter-spacing: 1px; }
    .nav-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #8A9691; letter-spacing: 2px; }
  </style>

  <!-- Base Surfaces -->
  <rect width="1000" height="360" rx="8" fill="url(#bg-grad)"/>
  <rect width="1000" height="360" rx="8" fill="url(#subgrid-pattern)"/>
  <rect width="1000" height="360" rx="8" fill="url(#grid-pattern)"/>

  <!-- Dynamic Scanline Sweep across grid -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#18C7B5" stroke-width="2" class="anim-scanline" filter="url(#glow-filter)"/>

  <!-- Border Lines & Frame Corner Brackets -->
  <rect x="1" y="1" width="998" height="358" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M 1 24 L 1 1 L 24 1" stroke="#18C7B5" stroke-width="2" fill="none" filter="url(#glow-filter)"/>
  <path d="M 976 1 L 999 1 L 999 24" stroke="#18C7B5" stroke-width="2" fill="none" filter="url(#glow-filter)"/>
  <path d="M 999 336 L 999 359 L 976 359" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="2" fill="none"/>
  <path d="M 24 359 L 1 359 L 1 336" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="2" fill="none"/>

  <!-- DYNAMIC LIGHT TRAILS & SIGNAL FLOWS -->
  <g stroke-linecap="round">
    <!-- Static Base Trace -->
    <path d="M -50 280 C 200 280, 250 140, 500 140 C 750 140, 800 60, 1050 60" fill="none" stroke="#18C7B5" stroke-opacity="0.15" stroke-width="1.5"/>
    
    <!-- DYNAMIC FLOWING SIGNAL BEAM 1 (Teal Stream) -->
    <path d="M -50 280 C 200 280, 250 140, 500 140 C 750 140, 800 60, 1050 60" fill="none" stroke="url(#teal-beam)" stroke-width="3" class="anim-stream-1" filter="url(#glow-heavy)"/>

    <!-- DYNAMIC FLOWING SIGNAL BEAM 2 (Secondary Wave) -->
    <path d="M -50 300 C 220 300, 270 160, 520 160 C 770 160, 820 80, 1050 80" fill="none" stroke="url(#ember-beam)" stroke-width="2.5" class="anim-stream-2" filter="url(#glow-filter)"/>

    <!-- Geometric Data Rays -->
    <line x1="620" y1="0" x2="820" y2="360" stroke="#18C7B5" stroke-opacity="0.08" stroke-dasharray="4 4"/>
    <line x1="720" y1="0" x2="920" y2="360" stroke="#18C7B5" stroke-opacity="0.05"/>
    <line x1="150" y1="0" x2="350" y2="360" stroke="#8A9691" stroke-opacity="0.05" stroke-dasharray="2 4"/>
  </g>

  <!-- ANIMATED NODES & BEACONS -->
  
  <!-- Primary Ember Node with Breathing Pulse -->
  <g transform="translate(0, 0)">
    <circle cx="520" cy="160" r="18" fill="url(#ember-glow-dynamic)" class="anim-ember-pulse"/>
    <circle cx="520" cy="160" r="4.5" fill="#F26A2E" filter="url(#glow-filter)"/>
    <circle cx="520" cy="160" r="9" fill="none" stroke="#F26A2E" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="536" y="155" class="tag-mono" fill="#F26A2E" font-size="9.5" font-weight="700">NODE // 01 [SECURE_ACTIVE]</text>
  </g>

  <!-- Node 2: Pulsing Teal Node -->
  <g>
    <circle cx="270" cy="160" r="12" fill="url(#teal-glow-dynamic)" class="anim-status-dot"/>
    <circle cx="270" cy="160" r="3.5" fill="#18C7B5"/>
    <circle cx="270" cy="160" r="7" fill="none" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="1"/>
  </g>

  <!-- Node 3: Top Right Teal Node -->
  <g>
    <circle cx="770" cy="80" r="14" fill="url(#teal-glow-dynamic)" class="anim-status-dot"/>
    <circle cx="770" cy="80" r="4" fill="#18C7B5"/>
    <circle cx="770" cy="80" r="9" fill="none" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="tag-mono">SYS_ID // NELC_DIGITAL_01</text>
    <text x="920" y="0" class="tag-mono" text-anchor="end">LOCATION // LAGOS [6.5244° N, 3.3792° E]</text>
    <line x1="0" y1="12" x2="920" y2="12" stroke="#8A9691" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Hero Main Branding & Typography -->
  <g transform="translate(40, 115)">
    <text x="0" y="0" class="title-sub">NELC DIGITAL // INTELLIGENCE SYSTEMS STUDIO</text>
    
    <text x="0" y="45" class="title-main">NELC // SIGNAL ROOM</text>
    
    <text x="0" y="78" font-family="'Inter', sans-serif" font-size="15" fill="#8A9691" letter-spacing="0.3">
      Turning AI ambition into governed, secure, commercially intelligent systems.
    </text>

    <!-- Operational Status Pill with Live Pulse Dot -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="325" height="28" rx="4" fill="#080C0B" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#18C7B5" class="anim-status-dot" filter="url(#glow-filter)"/>
      <circle cx="16" cy="14" r="7" fill="none" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="1"/>
      <text x="32" y="18" class="pill-text">STATUS: BUILDING THE AI OPERATING LAYER</text>
    </g>
  </g>

  <!-- Bottom Navigation / Domain Bar -->
  <g transform="translate(40, 310)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Signal pulse indicator line -->
    <line x1="0" y1="0" x2="180" y2="0" stroke="#18C7B5" stroke-width="2" filter="url(#glow-filter)"/>

    <g transform="translate(0, 24)">
      <!-- Domain 1 -->
      <circle cx="6" cy="-4" r="3" fill="#18C7B5" class="anim-status-dot"/>
      <text x="16" y="0" class="nav-label">AI STRATEGY</text>

      <!-- Domain 2 -->
      <circle cx="236" cy="-4" r="3" fill="#18C7B5" class="anim-status-dot"/>
      <text x="246" y="0" class="nav-label">GOVERNANCE &amp; RISK</text>

      <!-- Domain 3 -->
      <circle cx="506" cy="-4" r="3" fill="#F26A2E" class="anim-status-dot"/>
      <text x="516" y="0" class="nav-label" fill="#F3F0E7">AI SECURITY</text>

      <!-- Domain 4 -->
      <circle cx="736" cy="-4" r="3" fill="#18C7B5" class="anim-status-dot"/>
      <text x="746" y="0" class="nav-label">FINAI &amp; VALUE</text>
    </g>
  </g>

</svg>
