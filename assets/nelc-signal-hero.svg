<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Dark graphite gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C0B"/>
      <stop offset="50%" stop-color="#0A0E0D"/>
      <stop offset="100%" stop-color="#141B19"/>
    </linearGradient>

    <!-- Signal Teal glows and traces -->
    <linearGradient id="teal-trace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0"/>
      <stop offset="20%" stop-color="#18C7B5" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0D8E86" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#18C7B5" stop-opacity="0"/>
    </linearGradient>

    <!-- Ember node glow -->
    <radialGradient id="ember-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F26A2E" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F26A2E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F26A2E" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal ambient glow -->
    <radialGradient id="teal-ambient" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#18C7B5" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0D8E86" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0A0E0D" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18C7B5" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#18C7B5" fill-opacity="0.15"/>
    </pattern>

    <!-- Fine mesh pattern -->
    <pattern id="subgrid-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#8A9691" stroke-opacity="0.02" stroke-width="0.5"/>
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #F3F0E7; font-size: 38px; letter-spacing: 2px; }
    .title-sub { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; font-weight: 500; fill: #8A9691; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
    .tag-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; font-size: 11px; fill: #18C7B5; letter-spacing: 1.5px; }
    .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #F3F0E7; letter-spacing: 1px; }
    .nav-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #8A9691; letter-spacing: 2px; }
  </style>

  <!-- Base Layer -->
  <rect width="1000" height="360" rx="8" fill="url(#bg-grad)"/>
  <rect width="1000" height="360" rx="8" fill="url(#subgrid-pattern)"/>
  <rect width="1000" height="360" rx="8" fill="url(#grid-pattern)"/>
  <rect width="1000" height="360" rx="8" fill="url(#teal-ambient)"/>

  <!-- Border lines -->
  <rect x="1" y="1" width="998" height="358" rx="7" fill="none" stroke="#18C7B5" stroke-opacity="0.18" stroke-width="1"/>
  
  <!-- Subtle Corner Frame Accents -->
  <path d="M 1 20 L 1 1 L 20 1" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="2" fill="none"/>
  <path d="M 980 1 L 999 1 L 999 20" stroke="#18C7B5" stroke-opacity="0.6" stroke-width="2" fill="none"/>
  <path d="M 999 340 L 999 359 L 980 359" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M 20 359 L 1 359 L 1 340" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="2" fill="none"/>

  <!-- Abstract Network Lines & Signal Curves (Background) -->
  <g stroke-linecap="round">
    <!-- Curved signal streams -->
    <path d="M -50 280 C 200 280, 250 140, 500 140 C 750 140, 800 60, 1050 60" fill="none" stroke="#18C7B5" stroke-opacity="0.12" stroke-width="1.5"/>
    <path d="M -50 300 C 220 300, 270 160, 520 160 C 770 160, 820 80, 1050 80" fill="none" stroke="url(#teal-trace)" stroke-width="2.5" filter="url(#blur-glow)"/>
    <path d="M -50 320 C 180 320, 300 220, 550 220 C 700 220, 850 180, 1050 180" fill="none" stroke="#0D8E86" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Geometric grid ray traces -->
    <line x1="620" y1="0" x2="820" y2="360" stroke="#18C7B5" stroke-opacity="0.06" stroke-dasharray="4 4"/>
    <line x1="720" y1="0" x2="920" y2="360" stroke="#18C7B5" stroke-opacity="0.04"/>
    <line x1="150" y1="0" x2="350" y2="360" stroke="#8A9691" stroke-opacity="0.04" stroke-dasharray="2 4"/>
  </g>

  <!-- Network Nodes & Illuminated Signals -->
  <!-- Node 1: Primary Ember Highlight -->
  <circle cx="520" cy="160" r="18" fill="url(#ember-glow)"/>
  <circle cx="520" cy="160" r="4" fill="#F26A2E"/>
  <circle cx="520" cy="160" r="8" fill="none" stroke="#F26A2E" stroke-opacity="0.6" stroke-width="1"/>
  <text x="535" y="155" class="tag-mono" fill="#F26A2E" font-size="9.5" opacity="0.9">NODE // 01 [SECURE]</text>

  <!-- Node 2: Teal Node -->
  <circle cx="270" cy="160" r="3" fill="#18C7B5"/>
  <circle cx="270" cy="160" r="7" fill="none" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="1"/>
  
  <!-- Node 3: Teal Node -->
  <circle cx="770" cy="80" r="3.5" fill="#18C7B5"/>
  <circle cx="770" cy="80" r="9" fill="none" stroke="#18C7B5" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Top System Header Bar -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="tag-mono">SYS_ID // NELC_DIGITAL_01</text>
    <text x="920" y="0" class="tag-mono" text-anchor="end">LOCATION // LAGOS [6.5244° N, 3.3792° E]</text>
    <line x1="0" y1="12" x2="920" y2="12" stroke="#8A9691" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Hero Main Branding & Typography -->
  <g transform="translate(40, 115)">
    <!-- Studio Header -->
    <text x="0" y="0" class="title-sub">NELC DIGITAL // INTELLIGENCE SYSTEMS STUDIO</text>
    
    <!-- Title -->
    <text x="0" y="45" class="title-main">NELC // SIGNAL ROOM</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="78" font-family="'Inter', sans-serif" font-size="15" fill="#8A9691" letter-spacing="0.3">
      Turning AI ambition into governed, secure, commercially intelligent systems.
    </text>

    <!-- Operational Status Pill -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="315" height="28" rx="4" fill="#141B19" stroke="#18C7B5" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#18C7B5"/>
      <circle cx="16" cy="14" r="7" fill="none" stroke="#18C7B5" stroke-opacity="0.5" stroke-width="1"/>
      <text x="32" y="18" class="pill-text">STATUS: BUILDING THE AI OPERATING LAYER</text>
    </g>
  </g>

  <!-- Bottom Navigation / Domain Bar -->
  <g transform="translate(40, 310)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#18C7B5" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Signal pulse indicator line -->
    <line x1="0" y1="0" x2="180" y2="0" stroke="#18C7B5" stroke-width="2" filter="url(#blur-glow)"/>

    <g transform="translate(0, 24)">
      <!-- Domain 1 -->
      <circle cx="6" cy="-4" r="2.5" fill="#18C7B5"/>
      <text x="16" y="0" class="nav-label">AI STRATEGY</text>

      <!-- Domain 2 -->
      <circle cx="236" cy="-4" r="2.5" fill="#18C7B5"/>
      <text x="246" y="0" class="nav-label">GOVERNANCE &amp; RISK</text>

      <!-- Domain 3 -->
      <circle cx="506" cy="-4" r="2.5" fill="#F26A2E"/>
      <text x="516" y="0" class="nav-label" fill="#F3F0E7">AI SECURITY</text>

      <!-- Domain 4 -->
      <circle cx="736" cy="-4" r="2.5" fill="#18C7B5"/>
      <text x="746" y="0" class="nav-label">FINAI &amp; VALUE</text>
    </g>
  </g>

</svg>
